<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Left motif: pulse/signal rings with a traveling message dot -->
  <circle cx="260" cy="250" r="170" fill="url(#glowBlue)"/>
  <g transform="translate(260,250)">
    <circle r="14" fill="#93c5fd" fill-opacity="0.9"/>
    <circle r="55" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.6"/>
    <circle r="100" fill="none" stroke="#60a5fa" stroke-opacity="0.28" stroke-width="1.3"/>
    <circle r="150" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.1"/>
  </g>
  <path d="M330,220 C400,180 460,190 520,150" fill="none" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="2 8"/>
  <circle cx="520" cy="150" r="6" fill="#22d3ee" fill-opacity="0.8"/>
  <circle cx="440" cy="175" r="4" fill="#60a5fa" fill-opacity="0.6"/>

  <!-- Right motif: smaller echo pulse -->
  <circle cx="1380" cy="330" r="110" fill="url(#glowCyan)"/>
  <g transform="translate(1380,330)" opacity="0.85">
    <circle r="9" fill="#93c5fd" fill-opacity="0.8"/>
    <circle r="34" fill="none" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.3"/>
    <circle r="62" fill="none" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1.1"/>
  </g>

  <g transform="translate(1300,140)" opacity="0.7">
    <circle r="5" fill="#22d3ee" fill-opacity="0.6"/>
    <circle r="22" fill="none" stroke="#93c5fd" stroke-opacity="0.3" stroke-width="1"/>
  </g>
</svg>
