<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Left motif: fanned stack of modular glass cards -->
  <circle cx="240" cy="260" r="170" fill="url(#glowBlue)"/>
  <g transform="translate(230,270)">
    <rect x="-120" y="-70" width="160" height="110" rx="14" fill="#f9fafb" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(-14)"/>
    <rect x="-90" y="-90" width="170" height="120" rx="14" fill="#f9fafb" fill-opacity="0.07" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.3" transform="rotate(-2)"/>
    <rect x="-60" y="-110" width="180" height="130" rx="14" fill="#0044ff" fill-opacity="0.14" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="1.5" transform="rotate(9)"/>
    <line x1="30" y1="-45" x2="30" y2="-5" stroke="#93c5fd" stroke-opacity="0.6" stroke-width="1.5" transform="rotate(9)"/>
    <line x1="10" y1="-25" x2="50" y2="-25" stroke="#93c5fd" stroke-opacity="0.6" stroke-width="1.5" transform="rotate(9)"/>
  </g>

  <!-- connective node line -->
  <path d="M410,270 C480,230 520,230 580,200" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="2 8"/>
  <circle cx="580" cy="200" r="5" fill="#22d3ee" fill-opacity="0.7"/>

  <!-- Right motif: single module tile with plus-cross, smaller scale -->
  <circle cx="1360" cy="180" r="110" fill="url(#glowCyan)"/>
  <g transform="translate(1360,180)">
    <rect x="-58" y="-58" width="116" height="116" rx="16" fill="#f9fafb" fill-opacity="0.06" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.3"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <g transform="translate(1470,360)" opacity="0.85">
    <rect x="-34" y="-34" width="68" height="68" rx="12" fill="#0044ff" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.1" transform="rotate(10)"/>
  </g>
</svg>
