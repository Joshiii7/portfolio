<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Left motif: focus-ring arcs around a glowing core, scattered access points -->
  <circle cx="260" cy="250" r="180" fill="url(#glowBlue)"/>
  <g transform="translate(260,250)">
    <circle r="18" fill="#93c5fd" fill-opacity="0.4" stroke="#f9fafb" stroke-opacity="0.85" stroke-width="2"/>
    <circle r="50" fill="none" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="10 10"/>
    <circle r="95" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="6 12"/>
    <circle r="145" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-width="1.1"/>

    <circle cx="130" cy="-60" r="7" fill="#93c5fd" fill-opacity="0.7"/>
    <circle cx="-110" cy="80" r="6" fill="#22d3ee" fill-opacity="0.6"/>
    <circle cx="60" cy="140" r="5" fill="#60a5fa" fill-opacity="0.6"/>
    <circle cx="-140" cy="-40" r="5" fill="#93c5fd" fill-opacity="0.5"/>
  </g>

  <!-- Right motif: smaller echo of the focus ring -->
  <circle cx="1380" cy="220" r="110" fill="url(#glowCyan)"/>
  <g transform="translate(1380,220)" opacity="0.85">
    <circle r="10" fill="#93c5fd" fill-opacity="0.4" stroke="#f9fafb" stroke-opacity="0.75" stroke-width="1.6"/>
    <circle r="30" fill="none" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle r="58" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.1"/>
  </g>

  <g transform="translate(1460,380)" opacity="0.75">
    <circle r="5" fill="#60a5fa" fill-opacity="0.6"/>
    <circle r="20" fill="none" stroke="#93c5fd" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
