<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Left motif: ascending tier bars -->
  <circle cx="260" cy="270" r="180" fill="url(#glowBlue)"/>
  <g transform="translate(140,330)">
    <rect x="0" y="-50" width="56" height="50" rx="10" fill="#f9fafb" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="70" y="-100" width="56" height="100" rx="10" fill="#f9fafb" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.3"/>
    <rect x="140" y="-165" width="56" height="165" rx="10" fill="#0044ff" fill-opacity="0.18" stroke="#93c5fd" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle cx="168" cy="-165" r="10" fill="#22d3ee" fill-opacity="0.6"/>
  </g>

  <!-- connective dotted arc suggesting growth -->
  <path d="M150,290 C220,260 300,220 360,180" fill="none" stroke="#93c5fd" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="2 8"/>

  <!-- Right motif: smaller mirrored ascending pair -->
  <circle cx="1380" cy="230" r="110" fill="url(#glowCyan)"/>
  <g transform="translate(1330,290)">
    <rect x="0" y="-40" width="38" height="40" rx="8" fill="#f9fafb" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.1"/>
    <rect x="48" y="-72" width="38" height="72" rx="8" fill="#0044ff" fill-opacity="0.14" stroke="#93c5fd" stroke-opacity="0.6" stroke-width="1.2"/>
  </g>

  <g transform="translate(1470,390)" opacity="0.8">
    <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#f9fafb" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1"/>
  </g>
</svg>
