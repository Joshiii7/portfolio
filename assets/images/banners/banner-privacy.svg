<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Left motif: abstract shield with protective rings -->
  <circle cx="260" cy="250" r="180" fill="url(#glowBlue)"/>
  <g transform="translate(260,250)">
    <circle r="150" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-width="1"/>
    <circle r="110" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1.1"/>
    <path d="M0,-70 L60,-45 L60,10 C60,55 30,80 0,95 C-30,80 -60,55 -60,10 L-60,-45 Z"
          fill="#0044ff" fill-opacity="0.16" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="1.6" filter="url(#soft)"/>
    <path d="M0,-70 L60,-45 L60,10 C60,55 30,80 0,95 C-30,80 -60,55 -60,10 L-60,-45 Z"
          fill="none" stroke="#93c5fd" stroke-opacity="0.85" stroke-width="1.8"/>
    <circle cy="10" r="14" fill="none" stroke="#f9fafb" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="30" stroke="#f9fafb" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- Right motif: standalone concentric ring only, echoing protection -->
  <circle cx="1380" cy="200" r="120" fill="url(#glowCyan)"/>
  <g transform="translate(1380,200)" opacity="0.85">
    <circle r="70" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.2"/>
    <circle r="42" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2"/>
    <circle r="16" fill="#93c5fd" fill-opacity="0.3" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="1.4"/>
  </g>

  <g transform="translate(1460,380)" opacity="0.7">
    <circle r="26" fill="none" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1"/>
  </g>
</svg>
