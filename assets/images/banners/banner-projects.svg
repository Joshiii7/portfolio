<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Left motif: bento-style mosaic gallery grid -->
  <circle cx="260" cy="250" r="180" fill="url(#glowBlue)"/>
  <g transform="translate(80,140)">
    <rect x="0" y="0" width="150" height="110" rx="12" fill="#0044ff" fill-opacity="0.16" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="1.4"/>
    <rect x="164" y="0" width="90" height="70" rx="10" fill="#f9fafb" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="164" y="84" width="90" height="80" rx="10" fill="#f9fafb" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.1"/>
    <rect x="0" y="124" width="70" height="90" rx="10" fill="#f9fafb" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="84" y="124" width="80" height="60" rx="10" fill="#22d3ee" fill-opacity="0.14" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="75" y1="55" x2="164" y2="35" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>
    <line x1="124" y1="154" x2="164" y2="120" stroke="#93c5fd" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- Right motif: two smaller mirrored tiles -->
  <circle cx="1380" cy="200" r="120" fill="url(#glowCyan)"/>
  <g transform="translate(1300,150)">
    <rect x="0" y="0" width="90" height="66" rx="10" fill="#f9fafb" fill-opacity="0.07" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="104" y="20" width="70" height="90" rx="10" fill="#0044ff" fill-opacity="0.14" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="45" y1="66" x2="45" y2="96" stroke="#93c5fd" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <g transform="translate(1420,370)" opacity="0.85">
    <rect x="-40" y="-30" width="80" height="60" rx="10" fill="#f9fafb" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>
