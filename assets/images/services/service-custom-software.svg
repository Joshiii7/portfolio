<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-hidden="true">
    <defs>
        <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1222"></stop>
            <stop offset="1" stop-color="#16223d"></stop>
        </linearGradient>
        <linearGradient id="cs-panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1f2937"></stop>
            <stop offset="1" stop-color="#111827"></stop>
        </linearGradient>
        <linearGradient id="cs-accent" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#0044ff"></stop>
            <stop offset="1" stop-color="#22d3ee"></stop>
        </linearGradient>
        <linearGradient id="cs-line" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee"></stop>
            <stop offset="1" stop-color="#60a5fa"></stop>
        </linearGradient>
        <radialGradient id="cs-glow-cyan" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"></stop>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop>
        </radialGradient>
        <radialGradient id="cs-glow-blue" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#0044ff" stop-opacity="0.35"></stop>
            <stop offset="1" stop-color="#0044ff" stop-opacity="0"></stop>
        </radialGradient>
        <pattern id="cs-dots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="1.5" cy="1.5" r="1.5" fill="#60a5fa" opacity="0.16"></circle>
        </pattern>
    </defs>

    <rect width="600" height="440" rx="32" fill="url(#cs-bg)"></rect>
    <rect width="600" height="440" rx="32" fill="url(#cs-dots)"></rect>
    <circle cx="486" cy="70" r="150" fill="url(#cs-glow-cyan)"></circle>
    <circle cx="80" cy="392" r="170" fill="url(#cs-glow-blue)"></circle>

    <!-- Connecting workflow lines -->
    <path d="M96 214 C120 214 118 178 148 178" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.7"></path>
    <path d="M96 244 C120 244 118 274 148 274" fill="none" stroke="#0044ff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.7"></path>
    <path d="M452 168 C478 168 470 132 500 132" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.6"></path>
    <path d="M452 214 C478 214 470 214 500 214" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.6"></path>
    <path d="M452 260 C478 260 470 296 500 296" fill="none" stroke="#0044ff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.6"></path>

    <!-- Database cylinder (source data) -->
    <g stroke="#60a5fa" stroke-width="2.5" fill="#111827">
        <ellipse cx="72" cy="196" rx="34" ry="12" fill="#1f2937"></ellipse>
        <path d="M38 196 L38 262 A34 12 0 0 0 106 262 L106 196" fill="#1f2937"></path>
        <ellipse cx="72" cy="262" rx="34" ry="12" fill="none"></ellipse>
        <ellipse cx="72" cy="229" rx="34" ry="12" fill="none" opacity="0.6"></ellipse>
    </g>

    <!-- Device reach: desktop, tablet, phone -->
    <g opacity="0.85">
        <rect x="500" y="104" width="60" height="42" rx="4" fill="none" stroke="#93c5fd" stroke-width="2"></rect>
        <line x1="522" y1="150" x2="538" y2="150" stroke="#93c5fd" stroke-width="2"></line>
        <rect x="504" y="188" width="44" height="56" rx="6" fill="none" stroke="#93c5fd" stroke-width="2"></rect>
        <rect x="512" y="256" width="28" height="52" rx="7" fill="none" stroke="#93c5fd" stroke-width="2"></rect>
        <circle cx="526" cy="300" r="1.6" fill="#93c5fd"></circle>
    </g>

    <!-- Central dashboard card -->
    <rect x="148" y="86" width="304" height="232" rx="18" fill="url(#cs-panel)" stroke="#0044ff" stroke-opacity="0.45" stroke-width="2"></rect>

    <!-- Dashboard header bar -->
    <circle cx="172" cy="112" r="4" fill="#f87171" opacity="0.8"></circle>
    <circle cx="188" cy="112" r="4" fill="#facc15" opacity="0.8"></circle>
    <circle cx="204" cy="112" r="4" fill="#4ade80" opacity="0.8"></circle>
    <rect x="360" y="104" width="72" height="16" rx="8" fill="#0044ff" fill-opacity="0.25"></rect>

    <!-- KPI tiles -->
    <g>
        <rect x="168" y="134" width="82" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
        <polyline points="178,170 190,158 200,166 212,148 224,156" fill="none" stroke="url(#cs-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>

        <rect x="260" y="134" width="82" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
        <circle cx="301" cy="161" r="20" fill="none" stroke="#334155" stroke-width="6"></circle>
        <circle cx="301" cy="161" r="20" fill="none" stroke="#22d3ee" stroke-width="6" stroke-dasharray="94 126" stroke-linecap="round" transform="rotate(-90 301 161)"></circle>

        <rect x="352" y="134" width="82" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
        <rect x="362" y="168" width="10" height="10" rx="2" fill="#60a5fa"></rect>
        <rect x="378" y="156" width="10" height="22" rx="2" fill="#0044ff"></rect>
        <rect x="394" y="146" width="10" height="32" rx="2" fill="#22d3ee"></rect>
        <rect x="410" y="160" width="10" height="18" rx="2" fill="#60a5fa"></rect>
    </g>

    <!-- Main bar chart -->
    <g>
        <line x1="168" y1="298" x2="434" y2="298" stroke="#334155" stroke-width="1.5"></line>
        <rect x="182" y="252" width="24" height="46" rx="4" fill="url(#cs-accent)"></rect>
        <rect x="222" y="230" width="24" height="68" rx="4" fill="url(#cs-accent)"></rect>
        <rect x="262" y="266" width="24" height="32" rx="4" fill="url(#cs-accent)" opacity="0.85"></rect>
        <rect x="302" y="212" width="24" height="86" rx="4" fill="url(#cs-accent)"></rect>
        <rect x="342" y="244" width="24" height="54" rx="4" fill="url(#cs-accent)" opacity="0.85"></rect>
        <rect x="382" y="224" width="24" height="74" rx="4" fill="url(#cs-accent)"></rect>
    </g>
</svg>
