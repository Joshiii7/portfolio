<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-hidden="true">
    <defs>
        <linearGradient id="fd-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1222"></stop>
            <stop offset="1" stop-color="#16223d"></stop>
        </linearGradient>
        <linearGradient id="fd-panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1f2937"></stop>
            <stop offset="1" stop-color="#111827"></stop>
        </linearGradient>
        <linearGradient id="fd-glyph" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0044ff"></stop>
            <stop offset="1" stop-color="#22d3ee"></stop>
        </linearGradient>
        <radialGradient id="fd-glow-blue" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#0044ff" stop-opacity="0.32"></stop>
            <stop offset="1" stop-color="#0044ff" stop-opacity="0"></stop>
        </radialGradient>
        <radialGradient id="fd-glow-cyan" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"></stop>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop>
        </radialGradient>
        <pattern id="fd-dots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="1.5" cy="1.5" r="1.5" fill="#60a5fa" opacity="0.16"></circle>
        </pattern>
    </defs>

    <rect width="600" height="440" rx="32" fill="url(#fd-bg)"></rect>
    <rect width="600" height="440" rx="32" fill="url(#fd-dots)"></rect>
    <circle cx="110" cy="380" r="160" fill="url(#fd-glow-blue)"></circle>
    <circle cx="500" cy="76" r="150" fill="url(#fd-glow-cyan)"></circle>

    <!-- Left: code panel -->
    <rect x="48" y="90" width="232" height="248" rx="16" fill="url(#fd-panel)" stroke="#0044ff" stroke-opacity="0.45" stroke-width="2"></rect>
    <circle cx="70" cy="112" r="4" fill="#f87171" opacity="0.85"></circle>
    <circle cx="86" cy="112" r="4" fill="#facc15" opacity="0.85"></circle>
    <circle cx="102" cy="112" r="4" fill="#4ade80" opacity="0.85"></circle>

    <!-- Code bracket glyph </> -->
    <g fill="none" stroke="url(#fd-glyph)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M132 158 L104 188 L132 218"></path>
        <path d="M196 158 L224 188 L196 218"></path>
        <path d="M176 148 L152 232"></path>
    </g>

    <!-- Faint code lines -->
    <g opacity="0.8">
        <rect x="64" y="248" width="60" height="6" rx="3" fill="#22d3ee" opacity="0.7"></rect>
        <rect x="128" y="248" width="34" height="6" rx="3" fill="#334155"></rect>
        <rect x="76" y="264" width="40" height="6" rx="3" fill="#60a5fa" opacity="0.7"></rect>
        <rect x="120" y="264" width="70" height="6" rx="3" fill="#334155"></rect>
        <rect x="64" y="280" width="90" height="6" rx="3" fill="#334155"></rect>
        <rect x="76" y="296" width="50" height="6" rx="3" fill="#0044ff" opacity="0.7"></rect>
        <rect x="130" y="296" width="60" height="6" rx="3" fill="#334155"></rect>
        <rect x="64" y="312" width="30" height="6" rx="3" fill="#334155"></rect>
    </g>

    <!-- Flow indicator -->
    <g fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M290 192 L306 204 L290 216" opacity="0.9"></path>
        <path d="M306 192 L322 204 L306 216" opacity="0.55"></path>
    </g>

    <!-- Right: rendered UI panel -->
    <rect x="322" y="90" width="232" height="248" rx="16" fill="url(#fd-panel)" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"></rect>
    <circle cx="344" cy="112" r="4" fill="#f87171" opacity="0.85"></circle>
    <circle cx="360" cy="112" r="4" fill="#facc15" opacity="0.85"></circle>
    <circle cx="376" cy="112" r="4" fill="#4ade80" opacity="0.85"></circle>
    <rect x="480" y="104" width="56" height="16" rx="8" fill="#334155"></rect>

    <rect x="340" y="140" width="46" height="8" rx="4" fill="#60a5fa" opacity="0.8"></rect>
    <rect x="394" y="140" width="34" height="8" rx="4" fill="#334155"></rect>
    <rect x="436" y="140" width="34" height="8" rx="4" fill="#334155"></rect>

    <!-- Primary button -->
    <rect x="340" y="164" width="136" height="34" rx="17" fill="url(#fd-glyph)"></rect>
    <rect x="368" y="177" width="80" height="8" rx="4" fill="#0b1222" opacity="0.55"></rect>

    <!-- Input with toggle -->
    <rect x="340" y="212" width="160" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="352" y="222" width="70" height="8" rx="4" fill="#334155"></rect>
    <rect x="472" y="218" width="26" height="16" rx="8" fill="#22d3ee" opacity="0.35"></rect>
    <circle cx="490" cy="226" r="6" fill="#22d3ee"></circle>

    <!-- Design token swatches -->
    <circle cx="352" cy="266" r="10" fill="#0044ff"></circle>
    <circle cx="380" cy="266" r="10" fill="#22d3ee"></circle>
    <circle cx="408" cy="266" r="10" fill="#60a5fa"></circle>
    <circle cx="436" cy="266" r="10" fill="#334155"></circle>

    <!-- Mini component card -->
    <rect x="340" y="288" width="176" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="352" y="300" width="26" height="26" rx="6" fill="#0044ff" opacity="0.4"></rect>
    <rect x="388" y="303" width="90" height="7" rx="3.5" fill="#60a5fa" opacity="0.7"></rect>
    <rect x="388" y="316" width="64" height="6" rx="3" fill="#334155"></rect>
</svg>
