<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-hidden="true">
    <defs>
        <linearGradient id="bw-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1222"></stop>
            <stop offset="1" stop-color="#16223d"></stop>
        </linearGradient>
        <linearGradient id="bw-panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1f2937"></stop>
            <stop offset="1" stop-color="#111827"></stop>
        </linearGradient>
        <linearGradient id="bw-hero" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0044ff"></stop>
            <stop offset="1" stop-color="#22d3ee"></stop>
        </linearGradient>
        <radialGradient id="bw-glow-cyan" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"></stop>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop>
        </radialGradient>
        <radialGradient id="bw-glow-blue" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#0044ff" stop-opacity="0.32"></stop>
            <stop offset="1" stop-color="#0044ff" stop-opacity="0"></stop>
        </radialGradient>
        <pattern id="bw-dots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="1.5" cy="1.5" r="1.5" fill="#60a5fa" opacity="0.16"></circle>
        </pattern>
    </defs>

    <rect width="600" height="440" rx="32" fill="url(#bw-bg)"></rect>
    <rect width="600" height="440" rx="32" fill="url(#bw-dots)"></rect>
    <circle cx="120" cy="70" r="150" fill="url(#bw-glow-blue)"></circle>
    <circle cx="500" cy="380" r="170" fill="url(#bw-glow-cyan)"></circle>

    <!-- Faint globe / online-presence motif -->
    <g stroke="#22d3ee" stroke-width="1.4" fill="none" opacity="0.35">
        <circle cx="486" cy="108" r="58"></circle>
        <ellipse cx="486" cy="108" rx="58" ry="22"></ellipse>
        <ellipse cx="486" cy="108" rx="24" ry="58"></ellipse>
        <line x1="428" y1="108" x2="544" y2="108"></line>
    </g>
    <g fill="#67e8f9" opacity="0.7">
        <circle cx="486" cy="50" r="2.5"></circle>
        <circle cx="534" cy="132" r="2.5"></circle>
        <circle cx="440" cy="140" r="2.5"></circle>
    </g>

    <!-- Desktop browser window -->
    <rect x="86" y="92" width="356" height="248" rx="16" fill="url(#bw-panel)" stroke="#0044ff" stroke-opacity="0.45" stroke-width="2"></rect>
    <rect x="86" y="92" width="356" height="36" rx="16" fill="#0f172a"></rect>
    <rect x="86" y="112" width="356" height="16" fill="#0f172a"></rect>
    <circle cx="110" cy="110" r="4" fill="#f87171" opacity="0.85"></circle>
    <circle cx="126" cy="110" r="4" fill="#facc15" opacity="0.85"></circle>
    <circle cx="142" cy="110" r="4" fill="#4ade80" opacity="0.85"></circle>
    <rect x="168" y="103" width="140" height="14" rx="7" fill="#1f2937" stroke="#334155" stroke-width="1"></rect>

    <!-- Nav row -->
    <rect x="106" y="142" width="46" height="8" rx="4" fill="#60a5fa" opacity="0.8"></rect>
    <rect x="160" y="142" width="34" height="8" rx="4" fill="#334155"></rect>
    <rect x="202" y="142" width="34" height="8" rx="4" fill="#334155"></rect>
    <rect x="244" y="142" width="34" height="8" rx="4" fill="#334155"></rect>
    <rect x="382" y="138" width="44" height="16" rx="8" fill="#0044ff" fill-opacity="0.3"></rect>

    <!-- Hero block -->
    <rect x="106" y="166" width="320" height="66" rx="10" fill="url(#bw-hero)" fill-opacity="0.85"></rect>
    <rect x="122" y="184" width="140" height="10" rx="5" fill="#0b1222" opacity="0.55"></rect>
    <rect x="122" y="202" width="90" height="8" rx="4" fill="#0b1222" opacity="0.4"></rect>

    <!-- Content cards row -->
    <rect x="106" y="246" width="98" height="72" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="118" y="258" width="74" height="8" rx="4" fill="#22d3ee" opacity="0.7"></rect>
    <rect x="118" y="272" width="56" height="6" rx="3" fill="#334155"></rect>
    <rect x="118" y="284" width="62" height="6" rx="3" fill="#334155"></rect>

    <rect x="214" y="246" width="98" height="72" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="226" y="258" width="74" height="8" rx="4" fill="#0044ff" opacity="0.7"></rect>
    <rect x="226" y="272" width="56" height="6" rx="3" fill="#334155"></rect>
    <rect x="226" y="284" width="62" height="6" rx="3" fill="#334155"></rect>

    <rect x="322" y="246" width="98" height="72" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="334" y="258" width="74" height="8" rx="4" fill="#60a5fa" opacity="0.7"></rect>
    <rect x="334" y="272" width="56" height="6" rx="3" fill="#334155"></rect>
    <rect x="334" y="284" width="62" height="6" rx="3" fill="#334155"></rect>

    <!-- Overlapping mobile window: same layout, stacked -->
    <rect x="366" y="196" width="132" height="212" rx="20" fill="url(#bw-panel)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"></rect>
    <rect x="378" y="214" width="108" height="10" rx="5" fill="#334155"></rect>
    <rect x="378" y="234" width="108" height="46" rx="8" fill="url(#bw-hero)" fill-opacity="0.85"></rect>
    <rect x="388" y="246" width="60" height="7" rx="3.5" fill="#0b1222" opacity="0.5"></rect>
    <rect x="378" y="290" width="108" height="40" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="388" y="300" width="50" height="6" rx="3" fill="#22d3ee" opacity="0.7"></rect>
    <rect x="388" y="312" width="70" height="5" rx="2.5" fill="#334155"></rect>
    <rect x="378" y="340" width="108" height="40" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.5"></rect>
    <rect x="388" y="350" width="50" height="6" rx="3" fill="#60a5fa" opacity="0.7"></rect>
    <rect x="388" y="362" width="70" height="5" rx="2.5" fill="#334155"></rect>
    <circle cx="432" cy="396" r="4" fill="none" stroke="#334155" stroke-width="1.5"></circle>
</svg>
